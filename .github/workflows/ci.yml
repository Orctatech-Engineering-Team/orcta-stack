name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # 2.9.0, not 2.7.14 (what the Dockerfiles pin) — the Node-compat
          # layer needed for jsdom's undici dependency to work isn't present
          # until 2.8.0. Test-tooling only; production images are unaffected
          # since they never run `deno test`.
          deno-version: "2.9.0"

      - name: Cache dependencies
        run: deno cache apps/backend/src/index.ts apps/backend/src/jobs/worker.ts

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check apps/backend/src/index.ts

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: deno install

      - name: Frontend lint
        run: deno run -A npm:@biomejs/biome@2.3.7 ci apps/frontend

      - name: Frontend type check
        working-directory: apps/frontend
        run: deno task typecheck

      - name: Frontend build
        working-directory: apps/frontend
        run: deno task build

      - name: Run migrations
        run: deno run --allow-env --allow-net --allow-read --allow-sys apps/backend/src/db/migrate.ts
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test

      - name: Test
        # Excludes apps/frontend deliberately — its jsdom-based tests run in
        # a separate process below. A frontend DOM-testing crash previously
        # took down unrelated backend test results by corrupting the shared
        # fetch/undici runtime when run in the same `deno test` invocation.
        run: deno test -A --ignore=apps/frontend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-for-ci-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:9999
          SERVER_URL: http://localhost:9999
          FRONTEND_URL: http://localhost:3000

      - name: Frontend test
        working-directory: apps/frontend
        run: deno task test
