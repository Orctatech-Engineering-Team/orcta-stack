name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache dependencies
        run: deno cache apps/backend/src/index.ts apps/backend/src/jobs/worker.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check apps/backend/src/index.ts

      - name: Run migrations
        run: deno run --allow-env --allow-net --allow-read --allow-sys apps/backend/src/db/migrate.ts
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test

      - name: Test
        run: deno test -A
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-for-ci-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:9999
          SERVER_URL: http://localhost:9999
          FRONTEND_URL: http://localhost:5173
